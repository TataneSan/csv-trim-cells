[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-trim-cells"
version = "1.0.0"
description = "Trim leading/trailing whitespace from CSV cells"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TataneSan"}]
keywords = ["csv", "whitespace", "trim", "clean", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Filters",
]

[project.scripts]
csv-trim-cells = "csv_trim_cells.cli:main"

[tool.setuptools.packages.find]
include = ["csv_trim_cells*"]
