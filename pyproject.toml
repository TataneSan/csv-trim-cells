[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-trim-cells"
version = "1.0.0"
description = "Strip leading/trailing whitespace from CSV cells (per-column, CI checks, JSON)"
readme = "README.md"
authors = [{name = "TataneSan"}]
license = {text = "MIT"}
requires-python = ">=3.9"

[project.scripts]
csv-trim-cells = "csv_trim_cells.cli:main"

[tool.setuptools.packages.find]
include = ["csv_trim_cells*"]
