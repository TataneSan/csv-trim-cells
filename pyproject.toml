[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-trim-cells"
version = "1.0.0"
description = "Trim whitespace in CSV cells (header aware, column-filtered, CI-friendly)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["csv", "trim", "whitespace", "cli", "ci"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
csv-trim-cells = "csv_trim_cells.cli:main"

[tool.setuptools.packages.find]
include = ["csv_trim_cells*"]
